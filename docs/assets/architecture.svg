<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="750" viewBox="0 0 1280 750" role="img" aria-labelledby="title desc">
  <title id="title">Open Scion architecture</title>
  <desc id="desc">A sparse workspace and direct API consumers send HTTP requests to one Scion server. The server exposes repository operations backed by a storage core. SQLite WAL stores changesets and mutable refs; compressed immutable blobs and persistent Merkle tree nodes live on disk. Workspace blobs are content-verified and cached within a 64 MiB limit. This is a single-node architecture with serialized SQLite write transactions.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#658371"/></marker>
  </defs>
  <rect width="1280" height="750" rx="22" fill="#f5f7f1"/>
  <rect x="1" y="1" width="1278" height="748" rx="22" fill="none" stroke="#dce5d7"/>
  <g font-family="Arial,Helvetica,sans-serif">
    <text x="48" y="54" font-size="12" font-weight="700" letter-spacing="2.5" fill="#53705b">ARCHITECTURE / CURRENT IMPLEMENTATION</text>
    <text x="48" y="99" font-size="33" font-weight="700" fill="#152e22">The repository stays on the server.</text>
    <text x="48" y="130" font-size="16" fill="#58705e">Clients materialize selected paths. Immutable history and shared refs have separate lifecycles.</text>

    <g font-size="11" font-weight="700" letter-spacing="1.8" fill="#64806b">
      <text x="48" y="179">CLIENTS</text><text x="470" y="179">ONE HTTP SERVER</text><text x="916" y="179">SERVER STORAGE</text>
    </g>

    <rect x="48" y="199" width="303" height="228" rx="15" fill="#ffffff" stroke="#cddac8" stroke-width="1.5"/>
    <rect x="69" y="221" width="42" height="26" rx="6" fill="#e9f1e3"/>
    <text x="79" y="239" fill="#285138" font-size="14" font-family="monospace">&gt;_</text>
    <text x="124" y="241" font-size="21" font-weight="700" fill="#1c3828">Sparse workspace</text>
    <text x="72" y="278" font-size="15" fill="#58705e">Selected files on disk</text>
    <text x="72" y="305" font-size="15" fill="#58705e">Local status and working-copy diff</text>
    <rect x="72" y="329" width="255" height="74" rx="10" fill="#edf4e8"/>
    <text x="88" y="355" font-size="14" font-weight="700" fill="#2a5037">Verified blob cache · 64 MiB</text>
    <text x="88" y="379" font-size="13" fill="#58705e">History served over the API</text>

    <rect x="48" y="475" width="303" height="108" rx="15" fill="#ffffff" stroke="#cddac8" stroke-width="1.5"/>
    <text x="72" y="509" font-size="20" font-weight="700" fill="#1c3828">Agents, scripts, and CI</text>
    <text x="72" y="539" font-size="15" fill="#58705e">Call the API directly</text>
    <text x="72" y="563" font-size="14" fill="#58705e">A checkout is optional</text>

    <path d="M351 281H457" fill="none" stroke="#658371" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M351 528H393V306H457" fill="none" stroke="#658371" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="370" y="260" fill="#58705e" font-size="11">HTTP + JSON</text>
    <text x="371" y="331" fill="#58705e" font-size="11">raw blobs</text>

    <rect x="470" y="199" width="334" height="384" rx="17" fill="#102b20"/>
    <rect x="494" y="224" width="286" height="86" rx="10" fill="#234332"/>
    <text x="514" y="253" font-size="19" font-weight="700" fill="#f1f7ed">Explicit HTTP endpoints</text>
    <text x="514" y="279" font-size="14" fill="#b7ceb8">Validation · optional bearer token</text>
    <path d="M637 314V339" stroke="#a8c89e" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="494" y="348" width="286" height="88" rx="10" fill="#234332"/>
    <text x="514" y="376" font-size="19" font-weight="700" fill="#f1f7ed">Repository operations</text>
    <text x="514" y="402" font-size="14" fill="#b7ceb8">Diff · merge · rebase · land</text>
    <text x="514" y="423" font-size="14" fill="#b7ceb8">History · blame · search</text>
    <path d="M637 440V462" stroke="#a8c89e" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="494" y="470" width="286" height="87" rx="10" fill="#b8ef97"/>
    <text x="514" y="500" font-size="19" font-weight="700" fill="#15351f">Storage core</text>
    <text x="514" y="525" font-size="14" fill="#315b38">Typed SHA-256 object identities</text>
    <text x="514" y="546" font-size="14" fill="#315b38">Persistent trees · atomic ref CAS</text>

    <path d="M804 493H852V287H902" fill="none" stroke="#658371" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M804 535H902" fill="none" stroke="#658371" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="916" y="199" width="316" height="174" rx="15" fill="#ffffff" stroke="#cddac8" stroke-width="1.5"/>
    <text x="940" y="237" font-size="22" font-weight="700" fill="#1c3828">SQLite WAL</text>
    <text x="940" y="272" font-size="15" fill="#58705e">Immutable changeset records</text>
    <text x="940" y="299" font-size="15" fill="#58705e">Mutable refs with compare-and-swap</text>
    <rect x="939" y="319" width="269" height="30" rx="7" fill="#f2efe3"/>
    <text x="952" y="339" font-size="13" fill="#786b40">Write transactions serialize writers</text>

    <rect x="916" y="411" width="316" height="172" rx="15" fill="#ffffff" stroke="#cddac8" stroke-width="1.5"/>
    <text x="940" y="449" font-size="22" font-weight="700" fill="#1c3828">Immutable object files</text>
    <text x="940" y="484" font-size="15" fill="#58705e">Compressed blobs and tree nodes</text>
    <text x="940" y="511" font-size="15" fill="#58705e">Unchanged subtrees are reused</text>
    <text x="940" y="545" font-size="14" font-family="monospace" fill="#315b38">objects/&lt;id[:2]&gt;/&lt;id[2:]&gt;</text>

    <line x1="48" y1="626" x2="1232" y2="626" stroke="#d5e1cf"/>
    <text x="48" y="660" font-size="15" font-weight="700" fill="#234832">Commit creates immutable history.</text>
    <text x="48" y="686" font-size="14" fill="#58705e">Land separately advances a shared ref, or fails if its expected value changed.</text>
    <text x="854" y="660" font-size="12" font-weight="700" letter-spacing="1" fill="#53705b">SINGLE-NODE SERVICE</text>
    <text x="854" y="686" font-size="13" fill="#58705e">SQLite metadata · immutable object files</text>
  </g>
</svg>
